name: macOS verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests and application type checking
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Verify packaged app and QA identities
        timeout-minutes: 6
        run: make qa-verify
      - name: Check release metadata generation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Capture isolated native UI
        timeout-minutes: 5
        run: ./scripts/capture_update_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-qa
          path: dist/ui-qa
          if-no-files-found: ignore
