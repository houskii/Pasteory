name: macOS verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests and application type checking
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Check release metadata generation
        run: python3 -m unittest discover -s scripts/tests -v
