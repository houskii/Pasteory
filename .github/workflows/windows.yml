name: Windows verification

on:
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  push:
    branches: [main]
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify history and settings
        run: dotnet run --project Windows/Tests/Pasteory.Core.Tests -c Release
      - name: Verify Windows clipboard formats and window resources
        run: dotnet run --project Windows/Tests/Pasteory.Windows.Tests -c Release -- --system-clipboard
      - name: Build portable Windows apps
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish Windows/Pasteory/Pasteory.csproj -c Release -r $rid --self-contained -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "dist/$rid/*" -DestinationPath "dist/Pasteory-$rid.zip"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pasteory-Windows-preview
          path: dist/Pasteory-win-*.zip
          if-no-files-found: error
