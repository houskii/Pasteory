name: Publish Pasteory Beta

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/beta-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and publish the signed DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: ./scripts/publish_beta.sh
