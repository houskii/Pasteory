<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1 data-i18n="title">Pasteory Web Context</h1>
    <p id="site" class="site"></p>
    <label class="row"><input id="enabled" type="checkbox"><span data-i18n="allow">Allow capture on this website</span></label>
    <p id="status" class="status">Checking connection…</p>
    <p class="hint" data-i18n="hint">Nearby page elements are read on copy only when Chrome capture in Pasteory and this website’s switch are both on.</p>
    <section id="blocked-section" hidden>
      <h2 data-i18n="blocked">Blocked Websites</h2>
      <div id="blocked-list"></div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
