<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Pasteory 网页来源</h1>
    <p id="site" class="site"></p>
    <label class="row"><input id="enabled" type="checkbox"><span>允许采集此网站</span></label>
    <p id="status" class="status">正在检查原生桥接…</p>
    <p class="hint">只有 Pasteory 中的 Chrome 总开关和此网站开关同时打开，复制时才会读取选区附近的网页元素。</p>
    <section id="blocked-section" hidden>
      <h2>已关闭的网站</h2>
      <div id="blocked-list"></div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
